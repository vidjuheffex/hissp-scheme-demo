[project]
name = "hissp-scheme-game"
version = "0.1.0"
description = "Infinite procedural terrain walker written in Scheme on Hissp + Ursina"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hissp-scheme",
    "hissp>=0.5.0",
    "panda3d==1.11.0.dev3849",
    "ursina",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.uv.sources]
hissp-scheme = { git = "https://github.com/vidjuheffex/hissp-scheme", branch = "main" }
ursina = { git = "https://github.com/pokepetter/ursina", branch = "master" }
panda3d = { index = "panda3d-archive" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[[tool.uv.index]]
name = "panda3d-archive"
url = "https://archive.panda3d.org/simple"
explicit = true
